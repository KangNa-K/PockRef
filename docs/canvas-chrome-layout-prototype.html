<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PockRef · 沉浸画布布局原型</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e8e9e3;
      --muted: #969b96;
      --line: rgba(255,255,255,.12);
      --glass: rgba(24,28,27,.78);
      --glass-strong: rgba(25,30,29,.94);
      --accent: #d8f36a;
      --accent-ink: #202617;
      --danger: #fa8e7c;
      --radius: 12px;
      --touch: 48px;
      --ease: cubic-bezier(.2,.8,.2,1);
      font-family: "Avenir Next", "Trebuchet MS", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #131615;
      color: var(--ink);
      overflow: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .stage {
      position: relative;
      height: 100vh;
      min-height: 520px;
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 51% 48%, rgba(117,139,114,.12), transparent 47%),
        linear-gradient(135deg,#1a1e1d 0%,#202624 52%,#171b1a 100%);
    }
    .stage::before {
      content: ""; position: absolute; inset: 0; z-index: -1; opacity: .3;
      background-image: radial-gradient(rgba(220,231,219,.16) .65px, transparent .65px);
      background-size: 24px 24px;
      mask-image: linear-gradient(90deg,transparent,black 15%,black 85%,transparent);
    }
    .stage::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
      box-shadow: inset 0 0 150px rgba(0,0,0,.28);
    }
    .topline {
      position: absolute; z-index: 10; left: 28px; right: 28px; top: 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      transition: opacity .35s var(--ease), transform .35s var(--ease);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 180px; }
    .brand-mark {
      width: 30px; height: 30px; border: 1px solid rgba(216,243,106,.6); border-radius: 9px;
      display: grid; place-items: center; color: var(--accent); font-size: 15px; font-weight: 800;
      transform: rotate(-7deg);
    }
    .brand-name { font-size: 13px; letter-spacing: .12em; font-weight: 700; }
    .brand-sub { display: block; color: var(--muted); font-size: 10px; letter-spacing: .12em; margin-top: 2px; }
    .state-switcher {
      display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 999px;
      background: rgba(12,15,14,.6); backdrop-filter: blur(16px); box-shadow: 0 8px 28px #0003;
    }
    .state-switcher button {
      border: 0; background: transparent; color: #a9afaa; border-radius: 999px;
      padding: 9px 13px; font-size: 11px; white-space: nowrap; transition: .2s var(--ease);
    }
    .state-switcher button:hover { color: white; background: #ffffff12; }
    .state-switcher button.active { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .canvas-meta { color: #aab0aa; font-size: 11px; text-align: right; min-width: 180px; }
    .canvas-meta strong { color: #e6e9e2; font-weight: 600; }
    .command-pill, .icon-button, .minimap-trigger, .dock, .action-menu, .minimap-card {
      border: 1px solid rgba(255,255,255,.14); background: var(--glass); backdrop-filter: blur(22px) saturate(130%);
      box-shadow: 0 12px 32px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.05);
    }
    .command-pill {
      position: absolute; z-index: 8; top: 90px; left: 28px; height: 52px; padding: 2px 5px;
      display: flex; align-items: center; border-radius: var(--radius);
      transition: opacity .35s var(--ease), transform .35s var(--ease);
    }
    .icon-button {
      width: var(--touch); height: var(--touch); display: grid; place-items: center; padding: 0;
      border-radius: 10px; background: transparent; border-color: transparent; box-shadow: none;
      color: #d5d9d3; transition: background .18s, color .18s, transform .18s;
    }
    .icon-button:hover { background: #ffffff12; color: white; }
    .icon-button:active { transform: scale(.92); }
    .icon-button svg, .state-switcher svg, .lock-button svg, .action-item svg, .dock button svg { width: 19px; height: 19px; }
    .divider { height: 23px; width: 1px; background: var(--line); margin: 0 3px; }
    .lock-button {
      position: absolute; z-index: 8; top: 90px; right: 28px; width: 52px; height: 52px;
      display: grid; place-items: center; border-radius: var(--radius); color: var(--accent);
      transition: opacity .35s var(--ease), transform .35s var(--ease), background .2s;
    }
    .lock-button:hover { background: rgba(216,243,106,.16); }
    .lock-button svg { width: 21px; height: 21px; }
    .lock-label { position:absolute; right:60px; top:17px; font-size:10px; letter-spacing:.08em; color:#adb4aa; white-space:nowrap; }
    .artboard {
      position: absolute; left: 50%; top: 52%; width: min(68vw, 1050px); height: min(62vh, 650px);
      transform: translate(-50%,-50%); transition: transform .5s var(--ease), filter .4s;
    }
    .ref {
      position: absolute; overflow: hidden; border: 1px solid rgba(255,255,255,.28);
      box-shadow: 0 24px 65px rgba(0,0,0,.38), 0 2px 8px #0008;
      background: #d5d1c8; color: #28302b;
      transition: transform .45s var(--ease), filter .35s, opacity .35s;
    }
    .ref-a { left: 9%; top: 8%; width: 31%; height: 73%; transform: rotate(-5deg); }
    .ref-b { right: 8%; top: 4%; width: 32%; height: 59%; transform: rotate(4deg); }
    .ref-c { left: 38%; bottom: 2%; width: 29%; height: 40%; transform: rotate(2deg); }
    .ref-a .poster { height: 100%; background: linear-gradient(158deg,#c7b7a5 0 17%,#838f7e 17% 38%,#3d5048 38% 66%,#d9c6a6 66% 100%); position: relative; }
    .poster::before { content:""; position:absolute; width:53%; aspect-ratio:1; border-radius:50%; left:24%; top:18%; background:radial-gradient(circle at 34% 30%,#d1c49d 0 12%,#747f6a 13% 37%,#283c38 38% 100%); box-shadow:0 40px 0 12px rgba(23,39,34,.5); }
    .poster::after { content:"FIELD NOTES\A 06 / 24"; white-space:pre; position:absolute; left:12%; bottom:9%; color:#f1e9d6; font:700 10px/1.6 "Avenir Next",sans-serif; letter-spacing:.16em; }
    .photo-b { width:100%; height:100%; position:relative; background:linear-gradient(180deg,#e7c87c 0%,#d38d65 38%,#725d5c 39%,#283f48 100%); }
    .photo-b::before { content:""; position:absolute; width:90%; height:48%; left:5%; bottom:-7%; border-radius:50% 50% 0 0; background:linear-gradient(140deg,#55716b,#223938 65%); }
    .photo-b::after { content:""; position:absolute; width:22%; height:45%; left:40%; bottom:10%; background:#34443c; clip-path:polygon(50% 0,100% 100%,0 100%); }
    .photo-c { width:100%; height:100%; background:linear-gradient(125deg,#e4d6c3 0 45%,#b5795f 45% 47%,#8a9a85 47% 100%); position:relative; }
    .photo-c::before { content:""; position:absolute; left:12%; top:14%; width:75%; height:70%; border:1px solid #fff9; background:repeating-linear-gradient(0deg,transparent 0 22px,#ffffff55 23px),repeating-linear-gradient(90deg,transparent 0 22px,#ffffff55 23px); transform:rotate(-8deg); }
    .caption { position:absolute; left:12px; bottom:10px; font-size:9px; letter-spacing:.12em; color:#fff; mix-blend-mode:screen; text-shadow:0 1px 6px #0008; }
    .selection-frame {
      position: absolute; left: 8.4%; top: 7.2%; width: 32.2%; height: 74.6%; border: 1.5px solid var(--accent);
      transform: rotate(-5deg); pointer-events:none; opacity:0; transition:opacity .3s;
    }
    .selection-frame::before { content:""; position:absolute; left:-3px; top:-3px; width:6px; height:6px; background:var(--accent); box-shadow:calc(32.2vw - 8px) 0 var(--accent), 0 calc(62vh - 8px) var(--accent), calc(32.2vw - 8px) calc(62vh - 8px) var(--accent); }
    .selection-tag { position:absolute; top:-24px; left:0; padding:4px 7px; border-radius:5px; background:var(--accent); color:var(--accent-ink); font-size:9px; font-weight:800; letter-spacing:.08em; }
    .minimap-wrap { position:absolute; z-index:8; left:28px; bottom:28px; transition:opacity .35s var(--ease), transform .35s var(--ease); }
    .minimap-trigger { width:48px; height:48px; display:grid; place-items:center; padding:0; border-radius:var(--radius); color:#e2e7df; transition:.22s var(--ease); }
    .minimap-trigger:hover { border-color:#ffffff38; transform:translateY(-2px); }
    .map-icon { width:18px; height:18px; border:1px solid currentColor; border-radius:4px; position:relative; }
    .map-icon::before { content:""; position:absolute; left:5px; top:0; height:100%; border-left:1px solid currentColor; }
    .map-icon::after { content:""; position:absolute; inset:4px 2px; border:1px solid currentColor; opacity:.65; }
    .minimap-card { position:absolute; left:0; bottom:58px; width:190px; padding:10px; border-radius:var(--radius); opacity:0; visibility:hidden; transform:translateY(8px); transition:.2s var(--ease); }
    .minimap-wrap.open .minimap-card { opacity:1; visibility:visible; transform:translateY(0); }
    .minimap-title { display:flex; justify-content:space-between; font-size:9px; color:#b6bcb6; margin-bottom:8px; letter-spacing:.08em; }
    .minimap-scene { height:104px; border-radius:7px; background:#353b37; position:relative; overflow:hidden; }
    .mini-paper { position:absolute; width:26%; height:60%; background:#a9a38e; transform:rotate(-7deg); left:22%; top:19%; }
    .mini-paper:nth-child(2) { left:53%; top:16%; transform:rotate(6deg); background:#b58768; }
    .mini-viewport { position:absolute; inset:10% 8%; border:1px solid var(--accent); box-shadow:0 0 0 100px #10141244; }
    .fab-wrap { position:absolute; z-index:9; right:28px; bottom:28px; transition:opacity .35s var(--ease), transform .35s var(--ease); }
    .fab { width:52px; height:52px; border:1px solid rgba(255,255,255,.18); border-radius:var(--radius); background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:0 12px 32px #0005; transition:transform .2s var(--ease), box-shadow .2s; }
    .fab:hover { transform:translateY(-3px) rotate(5deg); box-shadow:0 17px 34px #0007; }
    .fab svg { width:22px; height:22px; }
    .action-menu { position:absolute; right:0; bottom:62px; width:204px; padding:7px; border-radius:14px; opacity:0; visibility:hidden; transform:translateY(9px) scale(.98); transform-origin:bottom right; transition:.2s var(--ease); }
    .fab-wrap.open .action-menu { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
    .action-item { display:flex; align-items:center; gap:12px; width:100%; height:44px; padding:0 11px; border:0; border-radius:8px; background:transparent; text-align:left; font-size:12px; color:#dfe3dc; }
    .action-item:hover { background:#ffffff12; }
    .action-item svg { color:#b7c58d; }
    .action-item span { flex:1; }
    .shortcut { font-size:9px; color:#777f78; }
    .dock {
      position:absolute; z-index:9; left:50%; bottom:28px; transform:translate(-50%,18px); opacity:0; visibility:hidden;
      display:flex; align-items:center; gap:4px; padding:6px 8px 6px 13px; border-radius:14px; white-space:nowrap;
      transition:opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
    }
    .dock.show { opacity:1; visibility:visible; transform:translate(-50%,0); }
    .selection-count { font-size:11px; font-weight:700; padding-right:9px; color:#d9ded6; }
    .dock button { height:40px; min-width:42px; padding:0 10px; border:0; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:7px; background:transparent; color:#d7ddd5; font-size:11px; transition:.18s; }
    .dock button:hover { background:#ffffff12; }
    .dock button.delete { color:var(--danger); }
    .dock button.more { background:#ffffff12; padding:0 13px; }
    .dock-divider { height:22px; width:1px; background:var(--line); margin:0 3px; }
    .more-panel { position:absolute; z-index:8; left:50%; bottom:91px; width:min(460px,calc(100vw - 32px)); padding:16px; border-radius:16px; background:var(--glass-strong); border:1px solid var(--line); box-shadow:0 22px 70px #0008; backdrop-filter:blur(24px); opacity:0; visibility:hidden; transform:translate(-50%,10px); transition:.2s var(--ease); }
    .more-panel.open { opacity:1; visibility:visible; transform:translate(-50%,0); }
    .more-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .more-head strong { font-size:12px; }
    .more-head span { color:var(--muted); font-size:10px; }
    .more-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .more-grid button { min-height:68px; border:1px solid #ffffff0e; background:#ffffff08; border-radius:10px; color:#dbe0d8; font-size:10px; }
    .more-grid button:hover { border-color:#d8f36a55; background:#d8f36a0c; }
    .more-grid i { display:block; font-style:normal; font-size:18px; color:#cfeb76; margin-bottom:5px; }
    .hint { position:absolute; z-index:6; right:28px; bottom:93px; font-size:10px; color:#8d958d; opacity:.8; transition:opacity .25s; }
    .lock-note { position:absolute; z-index:7; left:50%; top:50%; transform:translate(-50%,-50%); padding:13px 18px; border:1px solid #ffffff20; border-radius:999px; background:#171c1bbb; backdrop-filter:blur(12px); color:#dce0d7; font-size:12px; letter-spacing:.04em; opacity:0; visibility:hidden; transition:.3s; }
    .lock-note b { color:var(--accent); font-weight:600; }
    .stage.locked .lock-note { opacity:1; visibility:visible; }
    .stage.locked .artboard { filter:brightness(.65) saturate(.72); }
    .stage.selected .selection-frame { opacity:1; }
    .stage.selected .dock { opacity:1; visibility:visible; transform:translate(-50%,0); }
    .stage.selected .dock.show { opacity:1; }
    .stage.menu-open .action-menu { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
    .stage.locked .command-pill, .stage.locked .minimap-wrap, .stage.locked .fab-wrap, .stage.locked .dock,
    .stage.locked .hint { opacity:0; visibility:hidden; transform:translateY(8px); pointer-events:none; }
    .stage.locked .lock-button { color:var(--accent); background:rgba(216,243,106,.12); }
    .stage.locked .topline { opacity:.55; }
    .stage.auto-hidden .command-pill, .stage.auto-hidden .minimap-wrap, .stage.auto-hidden .fab-wrap, .stage.auto-hidden .dock,
    .stage.auto-hidden .lock-button, .stage.auto-hidden .hint { opacity:0; visibility:hidden; transform:translateY(8px); pointer-events:none; }
    .stage.auto-hidden .topline { opacity:.16; }
    .stage.auto-hidden:hover .command-pill, .stage.auto-hidden:hover .minimap-wrap, .stage.auto-hidden:hover .fab-wrap,
    .stage.auto-hidden:hover .lock-button { opacity:1; visibility:visible; transform:none; pointer-events:auto; }
    .stage.auto-hidden:hover .topline { opacity:1; }
    .stage.auto-hidden:hover .dock.show { opacity:1; visibility:visible; transform:translate(-50%,0); pointer-events:auto; }
    .stage.locked .topline { pointer-events:none; }
    .state-note { position:absolute; z-index:8; left:28px; bottom:29px; font-size:10px; color:#7e8980; letter-spacing:.1em; text-transform:uppercase; }
    .toast { position:absolute; z-index:20; left:50%; top:82px; transform:translate(-50%,-8px); background:#e7efda; color:#20271f; padding:9px 14px; border-radius:8px; font-size:11px; font-weight:700; opacity:0; pointer-events:none; transition:.22s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:760px) {
      .stage { min-height:560px; }
      .topline { left:14px; right:14px; top:14px; align-items:flex-start; }
      .brand { min-width:0; }
      .brand-sub, .canvas-meta { display:none; }
      .brand-name { font-size:11px; }
      .state-switcher { position:absolute; left:0; top:42px; max-width:calc(100vw - 28px); overflow:auto; }
      .state-switcher button { padding:8px 10px; font-size:10px; }
      .command-pill { left:14px; top:101px; transform:scale(.9); transform-origin:top left; }
      .lock-button { top:101px; right:14px; }
      .lock-label { display:none; }
      .artboard { width:92vw; height:54vh; top:48%; }
      .ref-a { left:3%; width:39%; }
      .ref-b { right:2%; width:39%; }
      .ref-c { left:36%; width:34%; }
      .minimap-wrap { left:14px; bottom:17px; }
      .fab-wrap { right:14px; bottom:17px; }
      .dock { left:10px; right:10px; bottom:0; width:calc(100% - 20px); transform:translateY(18px); justify-content:space-between; border-radius:14px 14px 0 0; overflow:auto; padding:7px; }
      .stage.selected .dock { transform:translateY(0); }
      .stage.selected .minimap-wrap, .stage.selected .fab-wrap { bottom:86px; }
      .selection-count { padding:0 4px; font-size:10px; }
      .dock button { min-width:38px; height:42px; padding:0 7px; font-size:0; }
      .dock button.more { font-size:10px; }
      .dock button svg { width:18px; height:18px; }
      .hint { display:none; }
      .more-panel { bottom:82px; }
      .more-grid { grid-template-columns:repeat(3,1fr); }
      .state-note { left:14px; bottom:76px; }
      .stage.selected .state-note { display:none; }
      .selection-frame { width:40%; height:58%; left:2%; top:5%; }
      .selection-frame::before { box-shadow:calc(40vw - 8px) 0 var(--accent), 0 calc(54vh - 8px) var(--accent), calc(40vw - 8px) calc(54vh - 8px) var(--accent); }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="stage" id="stage" data-state="normal">
    <header class="topline">
      <div class="brand"><div class="brand-mark">P</div><div><span class="brand-name">POCKREF</span><span class="brand-sub">REFERENCE CANVAS / 06</span></div></div>
      <nav class="state-switcher" aria-label="原型状态">
        <button class="active" data-mode="normal">普通画布</button>
        <button data-mode="selected">选中对象</button>
        <button data-mode="menu">动作菜单</button>
        <button data-mode="locked">锁定预览</button>
        <button data-mode="hidden">自动隐藏</button>
      </nav>
      <div class="canvas-meta"><strong>概念板 · 山野色彩研究</strong><br>3 张参考图 <span style="color:#657066">·</span> 已自动保存</div>
    </header>

    <section class="command-pill" aria-label="画布命令">
      <button class="icon-button" data-toast="关闭当前画布" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      <button class="icon-button" data-toast="选择导入来源" aria-label="导入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4"/></svg></button>
      <span class="divider"></span>
      <button class="icon-button" data-toast="撤销上一步" aria-label="撤销"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg></button>
      <button class="icon-button" data-toast="重做上一步" aria-label="重做"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h2"/></svg></button>
    </section>

    <button class="lock-button icon-button" id="lockButton" aria-label="锁定画布"><span class="lock-label">锁定画布</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg></button>

    <div class="artboard" aria-label="参考图画布">
      <article class="ref ref-a"><div class="poster"></div></article>
      <article class="ref ref-b"><div class="photo-b"></div><span class="caption">RIDGE / 07:42 AM</span></article>
      <article class="ref ref-c"><div class="photo-c"></div><span class="caption">STUDY 03 — MATERIAL</span></article>
      <div class="selection-frame"><span class="selection-tag">参考图 · 01</span></div>
    </div>

    <div class="minimap-wrap" id="minimap">
      <div class="minimap-card"><div class="minimap-title"><span>画布导航</span><span>100%</span></div><div class="minimap-scene"><i class="mini-paper"></i><i class="mini-paper"></i><i class="mini-viewport"></i></div></div>
      <button class="minimap-trigger" aria-label="展开画布导航"><span class="map-icon"></span></button>
    </div>

    <div class="fab-wrap" id="fabWrap">
      <div class="action-menu" aria-label="更多画布动作">
        <button class="action-item" data-toast="进入标记模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m14 7 3 3"/></svg><span>标记</span><small class="shortcut">M</small></button>
        <button class="action-item" data-toast="添加文本标注"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6V4h16v2M12 4v16m-4 0h8"/></svg><span>添加文本</span><small class="shortcut">T</small></button>
        <button class="action-item" data-toast="打开画布设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1.9-1.1 2-1.4-.5a8 8 0 0 1-1.5.9l-.2 1.5h-2.3l-.3-1.5a8 8 0 0 1-1.5-.9l-1.4.5-1.1-2 1.1-.9a7 7 0 0 1 0-1.8l-1.1-.9 1.1-2 1.4.5a8 8 0 0 1 1.5-.9l.3-1.5h2.3l.2 1.5a8 8 0 0 1 1.5.9l1.4-.5 1.1 2-1.1.9a7 7 0 0 1 0 1.8Z" transform="translate(-2 -1)"/></svg><span>设置</span><small class="shortcut">⌘ ,</small></button>
        <button class="action-item" data-toast="导出画布图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v12m0 0 5-5m-5 5-5-5M5 20h14"/></svg><span>导出画布</span><small class="shortcut">⇧ E</small></button>
        <button class="action-item" data-toast="保存场景"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h12l3 3v13H4V4h1Z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg><span>保存场景</span><small class="shortcut">⌘ S</small></button>
      </div>
      <button class="fab" id="fabButton" aria-label="一键排版"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15ZM5 14l.7 2.3L8 17l-2.3.7L5 20l-.7-2.3L2 17l2.3-.7L5 14Z"/></svg></button>
    </div>

    <div class="dock" id="dock" aria-label="选择对象操作">
      <span class="selection-count" id="selectionCount">已选 1 张</span>
      <span class="dock-divider"></span>
      <button data-toast="水平镜像"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M5 7h5v10H5zM14 7h5v10h-5z"/></svg><span>镜像</span></button>
      <button data-toast="切换灰度"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18V3Z" fill="currentColor" stroke="none"/></svg><span>灰度</span></button>
      <button data-toast="锁定所选图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg><span>锁定</span></button>
      <button data-toast="复制选择"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg><span>复制</span></button>
      <button class="delete" data-toast="删除选择"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>删除</span></button>
      <span class="dock-divider"></span>
      <button class="more" id="moreButton">更多 <span>⌃</span></button>
    </div>
    <section class="more-panel" id="morePanel"><div class="more-head"><strong>选择操作</strong><span>单选与多选共用 · 更多操作</span></div><div class="more-grid">
      <button data-toast="旋转所选图片"><i>↻</i>旋转</button><button data-toast="裁切所选图片"><i>⌗</i>裁切</button><button data-toast="恢复原图"><i>⟲</i>复原</button><button data-toast="复制所选图片"><i>▢</i>复制</button>
      <button data-toast="自动对齐所选图片"><i>↔</i>对齐</button><button data-toast="创建图片组"><i>▧</i>创建组</button><button data-toast="导出所选图片"><i>⇩</i>导出</button><button data-toast="删除所选图片"><i>×</i>删除</button>
    </div></section>
    <div class="hint">长按 FAB · 更多工具</div>
    <div class="state-note">Canvas / 01 — moodboard</div>
    <div class="lock-note">画布已冻结 <b>· 点右上角解锁</b></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <script>
    const stage = document.querySelector('#stage');
    const switchButtons = [...document.querySelectorAll('.state-switcher button')];
    const minimap = document.querySelector('#minimap');
    const fabWrap = document.querySelector('#fabWrap');
    const morePanel = document.querySelector('#morePanel');
    const toast = document.querySelector('#toast');
    let toastTimer;

    function setMode(mode) {
      stage.classList.remove('selected', 'locked', 'auto-hidden', 'menu-open');
      document.body.dataset.mode = mode;
      switchButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
      if (mode === 'selected') {
        stage.classList.add('selected');
        document.querySelector('#selectionCount').textContent = '已选 1 张';
      } else if (mode === 'menu') {
        stage.classList.add('menu-open');
        fabWrap.classList.add('open');
      } else if (mode === 'locked') {
        stage.classList.add('locked');
        fabWrap.classList.remove('open');
      } else if (mode === 'hidden') {
        stage.classList.add('auto-hidden');
        fabWrap.classList.remove('open');
      }
      if (mode !== 'menu') fabWrap.classList.remove('open');
      morePanel.classList.remove('open');
      minimap.classList.remove('open');
    }
    switchButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));

    document.querySelector('#fabButton').addEventListener('click', () => {
      fabWrap.classList.toggle('open');
      stage.classList.toggle('menu-open', fabWrap.classList.contains('open'));
    });
    document.querySelector('#fabButton').addEventListener('contextmenu', event => {
      event.preventDefault(); fabWrap.classList.toggle('open');
    });
    document.querySelector('#minimap .minimap-trigger').addEventListener('click', () => minimap.classList.toggle('open'));
    document.querySelector('#lockButton').addEventListener('click', () => {
      const locked = !stage.classList.contains('locked');
      setMode(locked ? 'locked' : 'normal');
    });
    document.querySelector('#moreButton').addEventListener('click', () => morePanel.classList.toggle('open'));
    document.addEventListener('click', event => {
      if (!event.target.closest('#fabWrap')) { fabWrap.classList.remove('open'); stage.classList.remove('menu-open'); }
      if (!event.target.closest('#minimap')) minimap.classList.remove('open');
      if (!event.target.closest('#morePanel') && !event.target.closest('#moreButton')) morePanel.classList.remove('open');
      const action = event.target.closest('[data-toast]');
      if (action) showToast(action.dataset.toast);
    });
    function showToast(message) {
      toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
    }
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { morePanel.classList.remove('open'); fabWrap.classList.remove('open'); minimap.classList.remove('open'); }
    });
  </script>
</body>
</html>
